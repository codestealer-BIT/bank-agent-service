openapi: 3.1.0
info:
  title: Bank Letta Agent Service
  version: 0.1.0
  description: Prototype contract. Replace X-User-Id with bank-issued JWT/mTLS identity in production.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    DemoUserId:
      type: apiKey
      in: header
      name: X-User-Id
  schemas:
    Conversation:
      type: object
      required: [id, user_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string }
        letta_conversation_id: { type: [string, "null"] }
        title: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MessageRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 32000 }
        request_id: { type: string, description: Stable idempotency key generated by the caller. }
    MessageResponse:
      type: object
      required: [request_id, conversation_id, answer, idempotent_replay]
      properties:
        request_id: { type: string }
        conversation_id: { type: string, format: uuid }
        answer: { type: string }
        duration_ms: { type: [integer, "null"] }
        idempotent_replay: { type: boolean }
security:
  - DemoUserId: []
paths:
  /health:
    get:
      security: []
      summary: Liveness probe
      responses:
        "200": { description: Healthy }
  /v1/conversations:
    get:
      summary: List the authenticated user's conversations
      responses:
        "200": { description: Conversation list }
    post:
      summary: Create an isolated conversation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
  /v1/conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read the authenticated user's audited turn history
      responses:
        "200": { description: Message history }
        "404": { description: Not owned by this user }
    post:
      summary: Run one serialized Agent turn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageRequest" }
      responses:
        "200":
          description: Completed Agent turn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "404": { description: Not owned by this user }
        "503": { description: Queue full or dependency unavailable }
  /v1/memory:
    get:
      summary: Inspect only the authenticated user's local MemFS markdown files
      responses:
        "200": { description: User-owned memory files }
