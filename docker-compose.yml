services:
  api:
    build:
      context: .
    image: bank-letta-agent-service:local
    restart: unless-stopped
    read_only: true
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://bank_agent:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/bank_agent
      REDIS_URL: redis://redis:6379
      LETTA_LOCAL_BACKEND_EXPERIMENTAL: "1"
      LETTA_LOCAL_BACKEND_DIR: /data/local-backend
      LMSTUDIO_BASE_URL: ${LITELLM_BASE_URL:?Set LITELLM_BASE_URL in .env}
      LMSTUDIO_API_KEY: ${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env}
      AGENT_MODEL: lmstudio/${LITELLM_MODEL:-MiniMax-M3}
      SHARED_AGENT_SCOPE: ${SHARED_AGENT_SCOPE:-bank-operations-demo}
      MAX_GLOBAL_TURNS: ${MAX_GLOBAL_TURNS:-32}
      TURN_QUEUE_TIMEOUT_MS: ${TURN_QUEUE_TIMEOUT_MS:-120000}
      TURN_LEASE_MS: ${TURN_LEASE_MS:-600000}
      LETTA_REQUEST_TIMEOUT_MS: ${LETTA_REQUEST_TIMEOUT_MS:-600000}
      MEMORY_REFLECTION_ENABLED: ${MEMORY_REFLECTION_ENABLED:-true}
      MEMORY_REFLECTION_POLL_MS: ${MEMORY_REFLECTION_POLL_MS:-300000}
      MEMORY_REFLECTION_BATCH_SIZE: ${MEMORY_REFLECTION_BATCH_SIZE:-12}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-http://embeddings:80}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_EMBEDDING_TIMEOUT_MS: ${RAG_EMBEDDING_TIMEOUT_MS:-60000}
      RAG_CHUNK_CHARS: ${RAG_CHUNK_CHARS:-1200}
      RAG_CHUNK_OVERLAP_CHARS: ${RAG_CHUNK_OVERLAP_CHARS:-180}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.42}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,https://bank-agent.cloud.qyqiu.top:9003}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-LettaDemo@2026}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_AUTH_CODE: ${SMTP_AUTH_CODE:-}
      SMTP_DEFAULT_TO: ${SMTP_DEFAULT_TO:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-澄川智能运维助手}
    volumes:
      - letta_state:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /workspace:size=64m,uid=10001,gid=10001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embeddings:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 3g

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bank_agent
      POSTGRES_USER: bank_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_agent -d bank_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  embeddings:
    image: michaelf34/infinity:0.0.77-cpu
    restart: unless-stopped
    command:
      - "v2"
      - "--model-id"
      - "BAAI/bge-m3"
      - "--engine"
      - "torch"
      - "--device"
      - "cpu"
      - "--dtype"
      - "int8"
      - "--batch-size"
      - "4"
      - "--no-compile"
      - "--no-vector-disk-cache"
      - "--port"
      - "80"
    environment:
      DO_NOT_TRACK: "1"
      HF_HOME: /app/.cache
    volumes:
      - bge_model_cache:/app/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 5g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

volumes:
  letta_state:
  postgres_data:
  redis_data:
  bge_model_cache:
